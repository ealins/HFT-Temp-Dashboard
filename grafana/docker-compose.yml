# Grafana for the HFT sensor data.   cd grafana ; docker compose up -d   ->  http://localhost:3000  (admin / admin)
services:
  grafana:
    image: grafana/grafana-oss:latest
    container_name: hft-grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_SECURITY_ALLOW_EMBEDDING: "true"        # lets the Streamlit app show Grafana in a frame
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # read-only viewing without login (local use only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hft-rooms.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ../data/grafana:/data:ro            # hft_sensors.db, read-only
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
volumes:
  grafana-data:
